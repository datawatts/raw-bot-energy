<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Raw Bot Energy">
  <defs>
    <linearGradient id="bg" x1="16" y1="8" x2="112" y2="120" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1B1F3B"/>
      <stop offset="1" stop-color="#0B1026"/>
    </linearGradient>
    <linearGradient id="bolt" x1="54" y1="28" x2="78" y2="100" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFE566"/>
      <stop offset="1" stop-color="#FF8A1F"/>
    </linearGradient>
    <linearGradient id="ring" x1="28" y1="24" x2="100" y2="104" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6EE7FF"/>
      <stop offset="1" stop-color="#3B82F6"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <!-- soft glow -->
  <circle cx="64" cy="64" r="42" fill="#1E3A8A" opacity="0.35"/>
  <!-- orbit / sync ring -->
  <circle cx="64" cy="64" r="38" fill="none" stroke="url(#ring)" stroke-width="4" stroke-dasharray="18 10" stroke-linecap="round" opacity="0.9"/>
  <!-- bot head -->
  <rect x="42" y="40" width="44" height="36" rx="12" fill="#E8F1FF"/>
  <circle cx="54" cy="56" r="5" fill="#0B1026"/>
  <circle cx="74" cy="56" r="5" fill="#0B1026"/>
  <path d="M56 68h16" stroke="#0B1026" stroke-width="3" stroke-linecap="round"/>
  <!-- antenna -->
  <path d="M64 40V30" stroke="#6EE7FF" stroke-width="3" stroke-linecap="round"/>
  <circle cx="64" cy="26" r="4" fill="#FFE566"/>
  <!-- energy bolt overlaid -->
  <path d="M70 34 L54 66 H66 L58 94 L86 56 H70 Z" fill="url(#bolt)" stroke="#FFF3C4" stroke-width="1.5" stroke-linejoin="round"/>
</svg>
